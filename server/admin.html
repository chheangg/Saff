<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Saff Admin</title>
<style>
  :root { --bg:#000; --card:#141414; --line:#2a2a2a; --text:#fff; --mute:#9a9a9a; --green:#06C167; --red:#ff5a4f; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         padding:24px 16px calc(24px + env(safe-area-inset-bottom)); max-width:480px; margin-inline:auto; }
  h1 { font-size:32px; margin:0 0 4px; letter-spacing:-0.5px; }
  .meta { color:var(--mute); font-size:13px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-top:16px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--mute); display:inline-block; margin-right:8px; }
  .dot.on { background:var(--green); box-shadow:0 0 0 4px rgba(6,193,103,.2); }
  input { width:100%; background:#000; color:var(--text); border:1px solid var(--line); border-radius:999px; padding:14px 18px; font-size:16px; }
  button { font:inherit; border:0; cursor:pointer; }
  .pill { background:#fff; color:#000; border-radius:999px; padding:14px 18px; font-weight:600; }
  .grid { display:grid; grid-template-columns:1fr; gap:8px; margin-top:12px; }
  .prayer { display:flex; justify-content:space-between; align-items:center; width:100%; background:#000; color:var(--text);
            border:1px solid var(--line); border-radius:12px; padding:16px 18px; font-size:18px; font-weight:600; }
  .prayer span { color:var(--mute); font-weight:400; font-size:15px; }
  .prayer:active { background:#0a0a0a; }
  .prayer.fired { border-color:var(--green); }
  .prayer.fired span { color:var(--green); }
  .room { padding:12px 0; border-top:1px solid var(--line); }
  .room:first-child { border-top:0; padding-top:0; }
  .room b { text-transform:capitalize; }
  .names { color:var(--mute); font-size:13px; margin-top:4px; }
  .toast { position:fixed; left:16px; right:16px; bottom:calc(16px + env(safe-area-inset-bottom)); max-width:448px; margin:auto;
           background:#fff; color:#000; border-radius:12px; padding:14px 16px; font-weight:600; opacity:0; transform:translateY(8px); transition:.2s; }
  .toast.show { opacity:1; transform:none; }
  .toast.err { background:var(--red); color:#fff; }
  .link { background:none; color:var(--mute); text-decoration:underline; padding:0; font-size:13px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
  <h1>Saff Admin</h1>
  <div class="meta" id="sub">Fire the adhan to every phone running Saff.</div>

  <form class="card" id="login">
    <label class="meta" for="key">Admin key</label>
    <div class="row" style="margin-top:8px">
      <input id="key" type="password" autocomplete="current-password" placeholder="ADMIN_KEY" required>
      <button class="pill" type="submit">Enter</button>
    </div>
  </form>

  <div id="panel" hidden>
    <div class="card">
      <div class="row">
        <div><span class="dot" id="liveDot"></span><b id="liveText">No adhan live</b></div>
        <button class="link" id="logout" type="button">Lock</button>
      </div>
      <div class="meta" id="counts" style="margin-top:6px"></div>
    </div>

    <div class="card">
      <div class="meta">Tap a prayer to fire it now. It opens fresh 30-minute groups.</div>
      <div class="grid" id="prayers"></div>
    </div>

    <div class="card">
      <div class="meta" style="margin-bottom:12px">Groups right now</div>
      <div id="rooms"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  const $ = (id) => document.getElementById(id);
  const store = { get() { try { return localStorage.getItem('saff.adminKey') || ''; } catch { return ''; } },
                  set(v) { try { v ? localStorage.setItem('saff.adminKey', v) : localStorage.removeItem('saff.adminKey'); } catch {} } };
  let key = store.get();
  let timer = null;
  let firing = false;

  function toast(text, err) {
    const t = $('toast');
    t.textContent = text;
    t.className = 'toast show' + (err ? ' err' : '');
    clearTimeout(toast.h);
    toast.h = setTimeout(() => (t.className = 'toast'), 2500);
  }

  async function api(path, opts = {}) {
    const res = await fetch(path, { ...opts, headers: { 'content-type': 'application/json', 'x-admin-key': key, ...(opts.headers || {}) } });
    if (res.status === 401) throw new Error('bad key');
    if (!res.ok) throw new Error('server error ' + res.status);
    return res.json();
  }

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function render(s) {
    $('liveDot').className = 'dot' + (s.live ? ' on' : '');
    $('liveText').textContent = s.live ? `${s.adhan.label} is live` : 'No adhan live';
    const mins = s.live ? Math.max(0, Math.round((s.adhan.at + 30 * 60e3 - Date.now()) / 60e3)) : 0;
    $('counts').textContent = `${s.clients} phone${s.clients === 1 ? '' : 's'} connected · ${s.users} users` + (s.live ? ` · groups close in ${mins} min` : '');

    // Rebuild the buttons only when they change, so a tap never lands on a button being replaced.
    const sig = JSON.stringify([s.today, s.live && s.adhan.key]);
    if (sig === render.sig) return renderRooms(s);
    render.sig = sig;
    const grid = $('prayers');
    grid.replaceChildren(...s.today.map((p) => {
      const b = el('button', 'prayer' + (s.live && s.adhan.key === p.key ? ' fired' : ''));
      b.type = 'button';
      b.append(el('b', null, p.label), el('span', null, s.live && s.adhan.key === p.key ? 'Live' : p.time));
      b.onclick = () => fire(p);
      return b;
    }));
    renderRooms(s);
  }

  function renderRooms(s) {
    const rooms =s.rooms.filter((r) => r.members.length || r.messages);
    $('rooms').replaceChildren(...(rooms.length ? rooms.map((r) => {
      const d = el('div', 'room');
      const [campus, gender] = r.room.split(':');
      const head = el('div', 'row');
      head.append(el('b', null, `${campus.toUpperCase()} · ${gender}s`), el('span', 'meta', `${r.members.length} joined · ${r.messages} msgs`));
      d.append(head, el('div', 'names', r.members.join(', ') + (r.spot ? ` · spot: ${r.spot}` : '')));
      return d;
    }) : [el('div', 'meta', s.live ? 'Nobody has tapped "I\'m free" yet.' : 'Fire an adhan to open groups.')]));
  }

  async function refresh() {
    try { render(await api('/admin/status')); }
    catch (e) { if (e.message === 'bad key') return lock('Wrong key'); }
  }

  async function fire(p) {
    if (firing) return;
    if (!confirm(`Send the ${p.label} adhan to every connected phone now?`)) return;
    firing = true;
    try {
      const r = await api('/adhan', { method: 'POST', body: JSON.stringify({ prayer: p.key }) });
      toast(`${r.adhan.label} sent`);
      refresh();
    } catch (e) { e.message === 'bad key' ? lock('Wrong key') : toast('Could not send: ' + e.message, true); }
    finally { firing = false; }
  }

  function unlock() {
    $('login').hidden = true;
    $('panel').hidden = false;
    refresh();
    clearInterval(timer);
    timer = setInterval(refresh, 3000);
  }

  function lock(msg) {
    key = '';
    render.sig = null;
    store.set('');
    clearInterval(timer);
    $('panel').hidden = true;
    $('login').hidden = false;
    $('key').value = '';
    if (msg) { toast(msg, true); $('key').focus(); }
  }

  $('login').onsubmit = async (e) => {
    e.preventDefault();
    key = $('key').value.trim();
    try { await api('/admin/status'); store.set(key); $('key').value = ''; unlock(); }
    catch (err) { lock(err.message === 'bad key' ? 'Wrong key' : 'Server unreachable'); }
  };
  $('logout').onclick = () => lock();

  if (key) unlock();
</script>
</body>
</html>
